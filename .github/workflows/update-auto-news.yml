name: Update automatic news

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/fetch_auto_news.py'
      - 'tools/run_auto_news.py'
      - '.github/workflows/update-auto-news.yml'

permissions:
  contents: write

concurrency:
  group: auto-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-news:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install news URL decoder
        run: python -m pip install --disable-pip-version-check googlenewsdecoder
      - name: Fetch latest cheerleader news
        run: python tools/run_auto_news.py
      - name: Commit updated news
        run: |
          git add data/auto-news.json data/auto-news-meta.json
          if git diff --cached --quiet; then
            echo "No news changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto update cheerleader news"
          # A concurrent human commit must not be overwritten. Rebase or fail visibly.
          git pull --rebase origin main
          git push origin HEAD:main
