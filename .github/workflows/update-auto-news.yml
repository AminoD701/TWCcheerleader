name: Update automatic news

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/fetch_auto_news.py'
      - '.github/workflows/update-auto-news.yml'

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest cheerleader news
        run: python tools/fetch_auto_news.py
      - name: Commit updated news
        run: |
          git add data/auto-news.json
          if git diff --cached --quiet; then
            echo "No news changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto update cheerleader news"
          git push
