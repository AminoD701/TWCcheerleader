name: News filter state hotfix

on:
  push:
    branches:
      - fix/news-intel-20260906

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch stale hidden news filters
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          needle = '''            const getField = (n, keys, defaultVal = "") => {\n                for (let k of keys) { if (n[k]) return n[k].trim(); }\n                return defaultVal;\n            };\n\n            // 1. 呼叫雙層下拉選單渲染引擎\n'''
          repl = '''            const getField = (n, keys, defaultVal = "") => {\n                for (let k of keys) { if (n[k]) return n[k].trim(); }\n                return defaultVal;\n            };\n\n            // Keep hidden/restored filters from making the News page look empty after the feed changes.\n            const validNewsMains = new Set(["全部"]);\n            const validNewsSubs = new Map();\n            const validNewsHashtags = new Set();\n            dbNews.forEach(n => {\n                const mainTag = window.normalizeNewsCategory(getField(n, ['tag', '標籤', '分類標籤', '分類'], '未分類'));\n                const subTag = window.normalizeNewsSubcategory(n, mainTag);\n                validNewsMains.add(mainTag);\n                if (!validNewsSubs.has(mainTag)) validNewsSubs.set(mainTag, new Set());\n                if (subTag) validNewsSubs.get(mainTag).add(subTag);\n                const hashRaw = getField(n, ['hashtags', '標籤雲', '關鍵字', 'keywords'], '');\n                hashRaw.split(/[,\\s、，]+/).filter(Boolean).forEach(tag => validNewsHashtags.add(tag));\n            });\n            if (!validNewsMains.has(window.currentMainCategory)) {\n                window.currentMainCategory = "全部";\n                window.currentSubCategory = "全部";\n            } else if (window.currentMainCategory === "全部") {\n                window.currentSubCategory = "全部";\n            } else if (window.currentSubCategory !== "全部" && !(validNewsSubs.get(window.currentMainCategory)?.has(window.currentSubCategory))) {\n                window.currentSubCategory = "全部";\n            }\n            if (window.currentNewsHashtag && !validNewsHashtags.has(window.currentNewsHashtag)) {\n                window.currentNewsHashtag = "";\n            }\n\n            // 1. 呼叫雙層下拉選單渲染引擎\n'''
          if needle not in s:
              raise SystemExit('renderNewsHub insertion point not found')
          s = s.replace(needle, repl, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Add regression test
        run: |
          cat > tests/frontend/news-filter-state.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const html = fs.readFileSync('index.html', 'utf8');

          test('news hub clears stale hidden hashtag and invalid restored category state', () => {
            assert.match(html, /validNewsMains/);
            assert.match(html, /validNewsHashtags/);
            assert.match(html, /!validNewsMains\.has\(window\.currentMainCategory\)/);
            assert.match(html, /window\.currentNewsHashtag\s*=\s*""/);
            assert.match(html, /window\.currentSubCategory\s*=\s*"全部"/);
          });
          EOF
      - name: Run complete checks
        run: npm run check
      - name: Commit hotfix and remove one-shot workflow
        run: |
          git rm .github/workflows/news-filter-state-hotfix.yml
          git add index.html tests/frontend/news-filter-state.test.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: clear stale news filter state"
          git push
