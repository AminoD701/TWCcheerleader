name: Integrate automatic news

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_auto_news.py'
      - '.github/workflows/patch-auto-news.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: python tools/patch_auto_news.py
      - name: Commit integration
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate automatic news feed"
          git push
