name: Generate safe mobile app icons

on:
  push:
    paths:
      - 'tools/generate_safe_app_icons.py'
      - '.github/workflows/generate-safe-app-icons.yml'
      - 'app-icon-512.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate safe-zone icons
        run: python tools/generate_safe_app_icons.py
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add twc-app-icon-v3-180.png twc-app-icon-v3-192.png twc-app-icon-v3-512.png twc-app-icon-maskable-v3-512.png
          if git diff --cached --quiet; then
            echo "No icon changes"
          else
            git commit -m "Generate safe-zone mobile app icons"
            git push
          fi
