name: Integrate automatic public events

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_auto_events.py'
      - '.github/workflows/patch-auto-events.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Events integration
        run: python tools/patch_auto_events.py
      - name: Commit index update
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate automatic public events"
          git push
# re-run after restoring confirmed event data
