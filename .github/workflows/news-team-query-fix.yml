name: News team query fix

on:
  push:
    branches:
      - fix/news-intel-20260906

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install crawler dependency
        run: python -m pip install --disable-pip-version-check googlenewsdecoder
      - name: Apply roster team query fix
        run: python tools/patch_news_team_queries.py
      - name: Regenerate news feed
        run: python tools/fetch_auto_news.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run complete checks
        run: npm run check
      - name: Validate team query wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('tools/fetch_auto_news.py').read_text(encoding='utf-8')
          assert 'def build_queries(girl_names: list[str], site_teams: list[str])' in text
          assert 'for query in build_queries(girl_names, site_teams):' in text
          assert 'TEAM_QUERY_BATCH_SIZE' in text
          assert 'teams_expr' in text
          print('team query validation passed')
          PY
      - name: Commit generated fix
        run: |
          git add tools/fetch_auto_news.py data/auto-news.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: search roster teams in news crawler" || exit 0
          git push
