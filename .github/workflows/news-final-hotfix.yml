name: News final hotfix

on:
  push:
    branches:
      - fix/news-intel-20260906

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install crawler dependency
        run: python -m pip install --disable-pip-version-check googlenewsdecoder
      - name: Apply remaining fixes
        run: python tools/final_news_hotfix.py
      - name: Validate classification regressions
        run: python -c "import importlib.util; s=importlib.util.spec_from_file_location('news','tools/fetch_auto_news.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); p=m.classify_news('台鋼VS 統一七局下攻勢再起','今日賽事戰況更新',['一七'],['台鋼雄鷹']); c=m.classify_news('台鋼啦啦隊女孩一七應援人氣高','球場應援焦點',['一七'],['台鋼雄鷹']); assert p==('棒球情報','中職'),p; assert c and c[0]=='啦啦隊情報',c; print(p,c)"
      - name: Regenerate news feed
        run: python tools/fetch_auto_news.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run complete checks
        run: npm run check
      - name: Commit final fixes and remove one-shot files
        run: |
          git rm .github/workflows/news-final-hotfix.yml tools/final_news_hotfix.py
          git add tools/fetch_auto_news.py index.html data/auto-news.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: close final news review findings"
          git push
