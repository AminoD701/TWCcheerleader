name: News cache normalization fix

on:
  push:
    branches:
      - fix/news-intel-20260906

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize fast-start news merge path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = "if (mergedFreshNews.length > 0) dbNews = mergedFreshNews;"
          new = "if (mergedFreshNews.length > 0) {\n                                    dbNews = mergedFreshNews.map(n => {\n                                        const tag = window.normalizeNewsCategory(n.tag || n['標籤'] || n['分類'] || '未分類');\n                                        return { ...n, tag, subtag: window.normalizeNewsSubcategory(n, tag) };\n                                    });\n                                }"
          if old not in text:
              raise SystemExit('fast-start news assignment not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run complete checks
        run: npm run check
      - name: Validate cached path normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          assert 'dbNews = mergedFreshNews.map(n => {' in text
          assert "const tag = window.normalizeNewsCategory" in text
          assert 'subtag: window.normalizeNewsSubcategory(n, tag)' in text
          print('cached news normalization OK')
          PY
      - name: Commit fix and remove one-shot workflow
        run: |
          git rm .github/workflows/news-cache-normalize-fix.yml
          git add index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: normalize cached news startup path"
          git push
