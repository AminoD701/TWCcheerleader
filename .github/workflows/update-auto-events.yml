name: Update automatic public events

on:
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/fetch_priority_stores_direct.py'
      - 'tools/dedupe_auto_events.py'
      - 'data/event-social-posts.json'
      - 'data/event-social-sources.json'
      - 'requirements.txt'
      - 'data/event-crawler-state.json'
      - '.github/workflows/update-auto-events.yml'

concurrency:
  group: auto-events
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install anonymous crawler dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Crawl four stores from anonymous public HTML
        timeout-minutes: 4
        run: python tools/fetch_priority_stores_direct.py
      - name: Deduplicate automatic public events
        run: python tools/dedupe_auto_events.py
      - name: Update index integration
        run: python tools/patch_auto_events.py
      - name: Commit updated events and index
        run: |
          git add data/auto-events.json data/event-crawler-state.json index.html
          if git diff --cached --quiet; then
            echo "No event changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh direct public store events"
          git push
