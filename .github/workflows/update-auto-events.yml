name: Update automatic public events

on:
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/fetch_apify_social_events.py'
      - 'tools/fetch_apify_platform_events.py'
      - 'tools/dedupe_auto_events.py'
      - 'data/event-social-sources.json'
      - 'data/event-social-posts.json'
      - '.github/workflows/update-auto-events.yml'

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apify token
        run: |
          if [ -z "$APIFY_TOKEN" ]; then
            echo "APIFY_TOKEN is not configured. Aborting without changing event data."
            exit 1
          fi
      - name: Fetch Instagram and Threads independently via Apify
        continue-on-error: true
        timeout-minutes: 8
        run: python tools/fetch_apify_platform_events.py
      - name: Deduplicate preserved public events
        if: always()
        run: python tools/dedupe_auto_events.py
      - name: Commit updated events
        if: always()
        run: |
          git add data/auto-events.json
          if git diff --cached --quiet; then
            echo "No event changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto update public cheerleader events"
          git push
