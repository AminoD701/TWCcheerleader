name: Update automatic public events

on:
  workflow_dispatch:

# Retained only for manual maintenance; the public website no longer depends on crawler execution.
concurrency:
  group: auto-events
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-events:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Automatic crawler disabled; manual events are added through the website JSON export."
