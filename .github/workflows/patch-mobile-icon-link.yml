name: Patch mobile icon link

on:
  push:
    paths:
      - '.github/workflows/patch-mobile-icon-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-icon-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Apple touch icon link
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<link rel="apple-touch-icon" sizes="192x192" href="app-icon-192.png">'
          new = '<link rel="apple-touch-icon" sizes="180x180" href="twc-app-icon-v3-180.png">'
          if old not in text and new not in text:
              raise SystemExit('Expected apple-touch-icon link not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index change needed"
          else
            git commit -m "Use corrected Apple touch icon"
            git pull --rebase origin main
            git push
          fi
