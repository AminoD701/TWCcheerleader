name: Normalize news categories

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_news_categories.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize news categories
        run: python tools/patch_news_categories.py
      - name: Commit index update
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Normalize legacy and automatic news categories"
          git push
