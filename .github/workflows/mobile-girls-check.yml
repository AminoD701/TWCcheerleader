name: Mobile girls check
on:
  push:
    branches:
      - feature/mobile-girls-filters-20260906
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
