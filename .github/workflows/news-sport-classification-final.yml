name: News sport classification final

on:
  push:
    branches:
      - fix/news-intel-20260906

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install crawler dependency
        run: python -m pip install --disable-pip-version-check googlenewsdecoder
      - name: Enforce sport-first classification for pure sports stories
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/fetch_auto_news.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('TEAM_QUERY_BATCH_SIZE = 6\nMAX_TEAM_QUERY_BATCHES = 8\nTEAM_QUERY_BATCH_SIZE = 6\nMAX_TEAM_QUERY_BATCHES = 8\n', 'TEAM_QUERY_BATCH_SIZE = 6\nMAX_TEAM_QUERY_BATCHES = 8\n')
          old = '''    has_cheer_word = any(term.lower() in hay_lower for term in CHEER_TERMS)\n    if matched_girls or (matched_teams and has_cheer_word):\n        return "啦啦隊情報", (matched_girls[0] if matched_girls else matched_teams[0])\n    if has_cheer_word:\n        return "啦啦隊情報", "綜合"\n    for main_category, subcategory, terms in SPORT_RULES:\n        if any(term.lower() in hay_lower for term in terms):\n            return main_category, subcategory\n    return None\n'''
          new = '''    has_cheer_word = any(term.lower() in hay_lower for term in CHEER_TERMS)\n    matched_sport = None\n    for main_category, subcategory, terms in SPORT_RULES:\n        if any(term.lower() in hay_lower for term in terms):\n            matched_sport = (main_category, subcategory)\n            break\n\n    # Pure sports coverage stays in sports categories even if a roster girl/team name\n    # happens to appear in the article. Only explicit cheer/support wording can promote\n    # a sports-related story into cheerleader news.\n    if matched_sport and not has_cheer_word:\n        return matched_sport\n    if matched_girls or (matched_teams and has_cheer_word):\n        return "啦啦隊情報", (matched_girls[0] if matched_girls else matched_teams[0])\n    if has_cheer_word:\n        return "啦啦隊情報", "綜合"\n    if matched_sport:\n        return matched_sport\n    return None\n'''
          if old not in s:
              raise SystemExit('classification block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate classification behavior
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('news', 'tools/fetch_auto_news.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert mod.classify_news('中職 味全龍今天完封對手 林襄現身開球', '比賽戰況與投手表現', ['林襄'], ['味全龍']) == ('棒球情報','中職')
          cheer = mod.classify_news('中職 味全龍啦啦隊林襄應援', '啦啦隊女孩賽前應援活動', ['林襄'], ['味全龍'])
          assert cheer[0] == '啦啦隊情報', cheer
          assert mod.classify_news('MLB 大谷翔平單場雙響砲', '道奇賽事焦點', [], []) == ('棒球情報','MLB')
          print('classification regression checks passed')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run complete checks
        run: npm run check
      - name: Commit final fix and remove one-shot workflow
        run: |
          git rm .github/workflows/news-sport-classification-final.yml
          git add tools/fetch_auto_news.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: keep pure sports news out of cheer category"
          git push
