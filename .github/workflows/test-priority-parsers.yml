name: Test priority event parsers

on:
  push:
    branches: [main]
    paths:
      - 'tools/fetch_priority_store_events.py'
      - 'tools/fetch_priority_stores_direct.py'
      - 'tools/fetch_apify_social_events.py'
      - 'tools/fetch_apify_platform_events.py'
      - 'tools/run_event_fetch.py'
      - 'tools/fetch_auto_news.py'
      - 'tools/run_auto_news.py'
      - 'tests/test_priority_store_parsers.py'
      - 'tests/test_direct_crawler.py'
      - 'tests/test_auto_news_sources.py'
      - '.github/workflows/test-priority-parsers.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/test-priority-parsers.yml'
  workflow_dispatch:

# Fixture tests cover store/event parsers plus automatic-news discovery guards.
concurrency:
  group: priority-parser-tests
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --disable-pip-version-check pytest googlenewsdecoder
      - run: python -m pytest -q tests/test_priority_store_parsers.py tests/test_direct_crawler.py tests/test_auto_news_sources.py
