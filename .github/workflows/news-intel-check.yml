name: News intel check

on:
  push:
    branches:
      - fix/news-intel-20260906

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install crawler dependency
        run: python -m pip install --disable-pip-version-check googlenewsdecoder
      - name: Apply taxonomy patch
        run: python tools/patch_news_categories.py
      - name: Refresh automatic news
        run: python tools/fetch_auto_news.py
      - name: Validate generated taxonomy
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          rows=json.load(open('data/auto-news.json',encoding='utf-8'))
          allowed={'啦啦隊情報','棒球情報','籃球情報','排球情報'}
          assert rows, 'auto-news.json is empty'
          assert all(r.get('tag') in allowed for r in rows), Counter(r.get('tag') for r in rows)
          assert all(r.get('subtag') for r in rows), 'every news item needs a subcategory'
          sports=[r for r in rows if r.get('tag') != '啦啦隊情報']
          assert sum(r.get('subtag')=='中職' for r in sports) <= 6
          assert sum(r.get('subtag')=='MLB' for r in sports) <= 6
          assert sum(r.get('subtag')=='TPBL' for r in sports) <= 5
          assert sum(r.get('subtag')=='PLG' for r in sports) <= 4
          assert sum(r.get('subtag')=='TVBL' for r in sports) <= 5
          print(Counter(r['tag'] for r in rows))
          print(Counter(r['subtag'] for r in sports))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run frontend checks
        run: npm run check
      - name: Commit generated index and feed
        run: |
          git add index.html data/auto-news.json
          if git diff --cached --quiet; then
            echo "Generated files already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate news taxonomy and feed"
          git push
