<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="台灣啦啦隊資料庫：女孩、公開活動、班表、賽程、新聞、投票與每日抽卡。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TWC Cheer">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="canonical" href="https://aminod701.github.io/TWCcheerleader/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="TWC Cheer｜台灣啦啦隊資料庫">
  <meta property="og:description" content="追蹤女孩、公開活動、班表與球場情報。">
  <meta property="og:image" content="app-icon.svg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="TWC Cheer｜台灣啦啦隊資料庫">
  <meta name="twitter:description" content="追蹤女孩、公開活動、班表與球場情報。">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/desktop.css" media="(min-width: 861px)">
  <link rel="stylesheet" href="css/mobile.css" media="(max-width: 860px)">
  <title>TWC Cheer｜台灣啦啦隊資料庫</title>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <div id="offline-banner" class="status-banner status-offline" role="status" hidden>
    <span class="status-dot"></span><span>目前離線，顯示最近一次同步的資料</span>
  </div>
  <div id="update-banner" class="status-banner status-update" role="status" hidden>
    <span>有新版本可用</span><button type="button" data-action="apply-update">立即更新</button>
  </div>

  <div class="app-shell">
    <aside class="desktop-sidebar" aria-label="主要導覽">
      <a class="brand" href="?mode=home" data-route="home" aria-label="TWC Cheer 首頁">
        <span class="brand-mark">TC</span>
        <span><strong>TWC CHEER</strong><small>台灣啦啦隊資料庫</small></span>
      </a>
      <div class="sidebar-label">EXPLORE</div>
      <nav class="side-nav">
        <button data-route="home" class="nav-item active"><span data-icon="home"></span><span>首頁</span></button>
        <button data-route="girls" class="nav-item"><span data-icon="users"></span><span>女孩</span></button>
        <button data-route="events" class="nav-item"><span data-icon="calendar"></span><span>活動</span></button>
        <button data-route="schedule" class="nav-item"><span data-icon="clock"></span><span>班表</span></button>
        <button data-route="matches" class="nav-item"><span data-icon="trophy"></span><span>賽程</span></button>
        <button data-route="news" class="nav-item"><span data-icon="news"></span><span>新聞</span></button>
        <button data-route="vote" class="nav-item"><span data-icon="vote"></span><span>投票</span></button>
        <button data-route="gacha" class="nav-item"><span data-icon="sparkles"></span><span>抽卡</span></button>
        <button data-route="games" class="nav-item"><span data-icon="trophy"></span><span>遊戲中心</span></button>
      </nav>
      <div class="sidebar-spacer"></div>
      <button data-route="me" class="nav-item"><span data-icon="bookmark"></span><span>我的收藏</span></button>
      <a class="legacy-link" href="legacy.html" target="_blank" rel="noopener"><span data-icon="layers"></span><span>完整資料站</span></a>
      <div class="sidebar-footnote"><span class="live-dot"></span>資料源持續同步</div>
    </aside>

    <div class="app-main">
      <header class="app-bar">
        <button class="icon-button app-back" data-action="back" aria-label="返回" title="返回"><span data-icon="arrow-left"></span></button>
        <div class="app-bar-title"><span class="eyebrow" id="view-eyebrow">TWC CHEER</span><h1 id="view-title">首頁</h1></div>
        <div class="app-bar-actions">
          <button class="icon-button" data-action="toggle-search" aria-label="搜尋" title="搜尋"><span data-icon="search"></span></button>
          <button class="icon-button" data-action="toggle-theme" aria-label="切換主題" title="切換主題"><span data-icon="moon"></span></button>
          <button class="avatar-button" data-route="me" aria-label="開啟我的收藏"><span data-icon="user"></span></button>
        </div>
      </header>
      <section id="search-panel" class="search-panel" hidden>
        <label class="search-field"><span data-icon="search"></span><input id="global-search" type="search" inputmode="search" autocomplete="off" placeholder="搜尋女孩、活動或新聞"><button type="button" data-action="clear-search" aria-label="清除搜尋"><span data-icon="x"></span></button></label>
      </section>
      <div id="sync-meta" class="sync-meta" aria-live="polite"></div>
      <main id="view-root" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="App 導覽">
    <button data-route="home" class="bottom-item active"><span data-icon="home"></span><span>首頁</span></button>
    <button data-route="girls" class="bottom-item"><span data-icon="users"></span><span>女孩</span></button>
    <button data-route="events" class="bottom-item"><span data-icon="calendar"></span><span>行程</span></button>
    <button data-route="games" class="bottom-item"><span data-icon="trophy"></span><span>遊戲</span></button>
    <button data-route="me" class="bottom-item"><span data-icon="bookmark"></span><span>我的</span></button>
  </nav>

  <div id="sheet-root" class="sheet-root" hidden>
    <div class="sheet-backdrop" data-action="close-sheet"></div>
    <section class="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-handle"></div><button class="sheet-close icon-button" data-action="close-sheet" aria-label="關閉"><span data-icon="x"></span></button>
      <div id="sheet-content"></div>
    </section>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="js/app.js?v=7"></script>
</body>
</html>
