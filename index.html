        // =========================================================================
        // 女孩卡片網格渲染
        // =========================================================================
        function renderGirls() {
            const container = document.getElementById('grid-container');
            const search = (document.getElementById('searchInput').value || "").toLowerCase().trim();
            const nat = document.getElementById('natFilter').value;
            const zodiac = document.getElementById('zodiacFilter').value;
            const sort = document.getElementById('sortFilter').value;

            let result = dbGirls.filter(c => {
                const ms = currentSport === "全部" || (c.sport || "").includes(currentSport);
                const mt = currentTeam === "全部啦啦隊" || (c.team || "").trim() === currentTeam;
                const mS = search === "" || (c.nickname || "").toLowerCase().includes(search) || (c.realname || "").toLowerCase().includes(search);
                const mN = nat === 'all' || (c.nat || "").includes(nat);
                const cz = (c.zodiac || "").trim().replace("魔羯","摩羯").replace("白羊","牡羊");
                return ms && mt && mS && mN && (zodiac === 'all' || cz === zodiac);
            });

            if (currentSport === "全部" && currentTeam === "全部啦啦隊") {
                const mMap = new Map();
                result.forEach(c => { 
                    const k = (c.realname || "").trim(); if (!k) return;
                    if (!mMap.has(k)) { mMap.set(k, { ...c, mS: [c.sport || ""], mT: [c.team || ""], mN: [c.num || ""] }); } 
                    else { 
                        let e = mMap.get(k); 
                        if (!e.mS.includes(c.sport || "")) e.mS.push(c.sport || ""); 
                        if (!e.mT.includes(c.team || "")) e.mT.push(c.team || ""); 
                        if (!e.mN.includes(c.num || "") && c.num && c.num !== "-") e.mN.push(c.num || ""); 
                    } 
                });
                result = Array.from(mMap.values());
            }

            result.sort((a,b) => {
                if(sort === 'default') { 
                    const getNatWeight = (nat) => {
                        if ((nat || "").includes("韓國")) return 1;
                        if ((nat || "").includes("日本")) return 2;
                        if ((nat || "").includes("臺灣") || (nat || "").includes("台灣")) return 4;
                        return 3;
                    };
                    let wA = getNatWeight(a.nat); let wB = getNatWeight(b.nat);
                    if (wA !== wB) return wA - wB;

                    const isLastA = ((a.note || a['備註'] || a.備註 || "").includes('練習生') || (a.note || a['備註'] || a.備註 || "").includes('培訓生') || !a.num || a.num === "-") ? 1 : 0;
                    const isLastB = ((gB=b).note || gB['備註'] || gB.備註 || "").includes('練習生') || (gB.note || gB['備註'] || gB.備註 || "").includes('培訓生') || !gB.num || gB.num === "-" ? 1 : 0;
                    if (isLastA !== isLastB) return isLastA - isLastB;

                    let nA = parseInt(String((a.mN||[a.num])[0] || "").replace(/#/g, '')) || 999;
                    let nB = parseInt(String((b.mN||[b.num])[0] || "").replace(/#/g, '')) || 999;
                    return nA - nB;
                }
                if(sort === 'birthdayAsc') return parseGirlDOB(a.dob).mmdd - parseGirlDOB(b.dob).mmdd;
                if(sort === 'ageAsc') return parseGirlDOB(b.dob).num - parseGirlDOB(a.dob).num; 
                if(sort === 'heightDesc') return (parseFloat(b.height) || 0) - (parseFloat(a.height) || 0);
                if(sort === 'numberAsc') {
                    let nA = String((a.mN||[a.num])[0] || "").replace(/#/g, '');
                    let nB = String((b.mN||[b.num])[0] || "").replace(/#/g, '');
                    return (parseInt(nA) || 999) - (parseInt(nB) || 999);
                }
                return 0;
            });

            window.currentDisplayLimit = window.currentDisplayLimit || 24;

            let htmlContent = result.slice(0, window.currentDisplayLimit).map(c => {
                const teams = (c.mT || [c.team || ""]).map(t => t.trim()).filter(t => t);
                const sports = (c.mS || [c.sport || ""]);
                const cardAccent = (teamThemes[`${teams[0]}_${currentSport==="全部"?"":currentSport}`] || teamThemes[teams[0]] || teamThemes["全部啦啦隊"]).accent;
                
                const isFav = favSet.has(c.realname);
                
                let sportTags = sports.map(s => {
                    let type = s.includes("棒") ? 'baseball' : s.includes("籃") ? 'basketball' : s.includes("排") ? 'volleyball' : 'other';
                    return type === 'other' ? `<div class="sport-tag tag-other" title="${s}">其他</div>` : `<div class="sport-tag tag-${type}" title="${s}"></div>`;
                }).join('');
                
                let displayNum = (c.mN||[c.num]).filter(n=>n && n!=="-").map(n => '#' + String(n).replace(/#/g,'')).join(' ') || "-";
                let noteText = (c.note || c['備註'] || c.備註 || "").trim();

                return `
                <div class="card" style="border-bottom: 6px solid ${cardAccent}; --team-accent: ${cardAccent}" onclick="window.openModal('${c.realname}')">
                    <div class="photo-area">
                        <div class="sport-tags">${sportTags}</div>
                        <div class="fav-btn ${isFav ? 'active' : ''}" onclick="window.toggleFavorite('${c.realname}', event, this)">
                            <svg class="fav-icon" viewBox="0 0 24 24"><use xlink:href="#icon-heart"></use></svg>
                        </div>
                        ${c.img?`<img src="${window.getCdnUrl(c.img)}" loading="lazy" onerror="this.onerror=null; this.src='${c.img}';">`:''}
                    </div>
                    <div class="info-section">
                        <div class="header-info">
                            <div>
                                <div class="nickname-container" style="display:flex; align-items:center; gap:8px;">
                                    <div class="nickname" style="color:${cardAccent}">${c.realname}</div>
                                    ${c.ig ? `<a href="${c.ig}" target="_blank" class="ig-link" onclick="event.stopPropagation()"><svg class="ig-icon"><use xlink:href="#icon-ig"></use></svg></a>` : ''}
                                </div>
                                ${(c.nickname && c.nickname !== c.realname) ? `<div class="realname" style="font-size:14px; color:var(--text-sub); font-weight:700; margin-top:8px; letter-spacing:1px;">${c.nickname}</div>` : ''}
                            </div>
                            <div class="number">${displayNum}</div>
                        </div>
                        <div class="data-grid">
                            <div class="data-row" style="border-bottom: 2px dashed var(--border-color); padding-bottom: 10px; align-items: center;">
                                <span class="data-label">球隊 UNIT</span>
                                <div class="team-tags-wrapper">
                                    ${teams.map(t => `<span class="team-tag-mini" style="color:${cardAccent};">${t}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                        <div class="stats-grid">
                            <div class="stat-box"><span class="stat-label">國籍 NAT</span><span class="stat-value">${c.nat || "-"}</span></div>
                            <div class="stat-box"><span class="stat-label">身高 HEIGHT</span><span class="stat-value">${c.height ? c.height + ' cm' : '-'}</span></div>
                            <div class="stat-box"><span class="stat-label">星座 SIGN</span><span class="stat-value">${c.zodiac || "-"}</span></div>
                            <div class="stat-box"><span class="stat-label">生日 DOB</span><span class="stat-value">${c.dob || "-"}</span></div>
                        </div>
                        ${noteText ? `<div class="note-box">${noteText}</div>` : ''}
                    </div>
                </div>`;
            }).join('');

            if (result.length > window.currentDisplayLimit) {
                htmlContent += `
                <div style="grid-column: 1 / -1; text-align: center; margin-top: 20px; padding-bottom: 20px;">
                    <button onclick="window.currentDisplayLimit += 24; renderGirls();" class="enter-btn" style="display: inline-flex; font-size: 16px; padding: 12px 30px;">
                        載入更多女孩 LOAD MORE 🔽
                    </button>
                </div>`;
            }

            container.innerHTML = htmlContent;
        }

        // =========================================================================
        // 個人詳細彈窗
        // =========================================================================
        window.openModal = function(name) {
            const c = girlMap.get(name) || dbGirls.find(g => (g.realname||"").trim() === name.trim() || (g.nickname||"").trim() === name.trim());
            if(!c) return;
            
            const allRows = dbGirls.filter(g => (g.realname||"").trim() === c.realname.trim());
            const teams = [...new Set(allRows.map(g => (g.team||"").trim()).filter(t => t))];
            const sports = [...new Set(allRows.map(g => (g.sport||"").trim()).filter(s => s))];
            const nums = [...new Set(allRows.map(g => (g.num||"").trim()).filter(n => n && n !== "-"))].map(n => '#' + String(n).replace(/#/g,''));
            
            const lookupTeam = teams[0] || "全部啦啦隊"; 
            const lookupSport = currentSport === "全部" ? "" : currentSport;
            const themeConfig = teamThemes[`${lookupTeam}_${lookupSport}`] || teamThemes[lookupTeam] || teamThemes["全部啦啦隊"];
            const cardAccent = themeConfig.accent;
            const noteText = (c.note || c['備註'] || c.備註 || "").trim();

            let tags = sports.filter(s => s).map(s => {
                let type = s.includes("棒") ? 'baseball' : s.includes("籃") ? 'basketball' : s.includes("排") ? 'volleyball' : 'other';
                return type === 'other' ? `<div class="sport-tag tag-other" title="${s}">其他</div>` : `<div class="sport-tag tag-${type}" title="${s}"></div>`;
            }).join('');

            const today = new Date();
            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth() + 1;
            const todayNum = parseInt(`${currentYear}${String(currentMonth).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`);

            let herSchedules = dbSchedules.filter(s => 
                (s.name === (c.realname||"").trim() || s.name === (c.nickname||"").trim()) && 
                s.safeDate.year === currentYear && 
                s.safeDate.month === currentMonth &&
                s.safeDate.num >= todayNum
            );

            let scheduleHtml = '';
            if (herSchedules.length > 0) {
                herSchedules.sort((a, b) => a.safeDate.num - b.safeDate.num);
                let dateBoxes = '';

                herSchedules.forEach(s => {
                    let key = s.safeDate.num + '|' + s.team + '|' + s.sport;
                    let isSaved = schedSet.has(key);
                    let dateStr = `${s.safeDate.monStr}/${String(s.safeDate.day).padStart(2,'0')}`;
                    
                    dateBoxes += `
                    <div class="schedule-jump-btn" style="background: #111418; border: 1px solid ${cardAccent}; border-bottom: 3px solid ${cardAccent}; padding: 8px; border-radius: 4px; display: flex; flex-direction: column; align-items: center; box-shadow: 2px 2px 0px rgba(0,0,0,0.3); min-width: 75px; transition: 0.2s;">
                        <span onclick="window.goToSchedule('${s.team}', '${s.sport}')" style="font-size: 11px; color: var(--text-sub); font-weight: 700; width:100%; text-align:center;">${dateStr} / ${s.safeDate.week}</span>
                        <span onclick="window.goToSchedule('${s.team}', '${s.sport}')" style="font-family: var(--sport-font); font-size: 24px; font-weight: 900; color: #fff; line-height: 1.1; margin: 4px 0; width:100%; text-align:center;">${String(s.safeDate.day).padStart(2,'0')}</span>
                        <span onclick="window.goToSchedule('${s.team}', '${s.sport}')" style="font-size: 11px; color: ${cardAccent}; text-align: center; line-height: 1.2; font-weight: 700; margin-bottom:5px; width:100%;">${s.team}</span>
                        <button onclick="window.toggleMySchedule('${key}', ${s.safeDate.num}, '${dateStr}', '${s.team} 應援', event, this);" style="width:100%; padding:4px 0; font-size:11px; background:${isSaved?'var(--fav-accent)':'#333'}; color:#fff; border:1px solid ${isSaved?'transparent':'#2d3748'}; border-radius:2px; font-weight:900; cursor:pointer;">${isSaved?'➖ 移除':'➕ 加行程'}</button>
                    </div>`;
                });

                scheduleHtml = `
                    <div style="margin-top: 20px; border-top: 2px dashed var(--border-color); padding-top: 20px;">
                        <div style="font-family: var(--sport-font); font-size: 18px; font-weight: 900; color: ${cardAccent}; margin-bottom: 12px; letter-spacing: 1px; transform: skewX(-5deg);">本月應援 SCHEDULE <span style="font-size: 12px; color: var(--text-sub); font-family: var(--tc-font); font-weight: normal; margin-left: 5px;">(點日期前往)</span></div>
                        <div style="display: flex; flex-wrap: wrap; gap: 10px;">
                            ${dateBoxes}
                        </div>
                    </div>`;
            } else {
                scheduleHtml = `
                    <div style="margin-top: 20px; border-top: 2px dashed var(--border-color); padding-top: 20px;">
                        <div style="font-family: var(--sport-font); font-size: 18px; font-weight: 900; color: var(--text-sub); margin-bottom: 12px; letter-spacing: 1px; transform: skewX(-5deg);">本月應援 SCHEDULE</div>
                        <div style="font-size: 14px; color: #6a7a90; font-weight: 700;">本月目前尚無後續班表資料。</div>
                    </div>`;
            }

            document.documentElement.style.setProperty('--modal-accent', cardAccent);

            document.getElementById('modal-dynamic-content').innerHTML = `
                ${c.img ? `<img src="${c.img}" class="modal-photo">` : ''}
                <div class="modal-body">
                    <div class="sport-tags">${tags}</div>
                    
                    <div class="modal-header-info">
                        <div>
                            <div class="modal-nickname" style="color:${cardAccent}">${c.realname}</div>
                            ${(c.nickname && c.nickname !== c.realname) ? `<div class="modal-realname">${c.nickname}</div>` : ''}
                        </div>
                        <div class="modal-number">${nums.join(' ') || "-"}</div>
                    </div>
                    
                    <div class="modal-data-grid">
                        <div class="modal-data-row" style="border-bottom: 2px dashed var(--border-color); padding-bottom: 15px; margin-bottom: 5px; align-items: flex-start;">
                            <span class="modal-data-label" style="margin-top: 5px;">所屬球隊 UNIT</span>
                            <div class="team-tags-wrapper">
                                ${teams.map(t => `<span class="team-tag-mini" style="color:${cardAccent};">${t}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-box"><span class="stat-label">國籍 NAT</span><span class="stat-value">${c.nat || "-"}</span></div>
                        <div class="stat-box"><span class="stat-label">身高 HEIGHT</span><span class="stat-value">${c.height ? c.height + ' cm' : 'N/A'}</span></div>
                        <div class="stat-box"><span class="stat-label">星座 SIGN</span><span class="stat-value">${c.zodiac || "-"}</span></div>
                        <div class="stat-box"><span class="stat-label">生日 DOB</span><span class="stat-value">${c.dob || "-"}</span></div>
                    </div>
                    ${noteText ? `<div class="note-box">${noteText}</div>` : ''}
                    
                    ${scheduleHtml}
                    ${c.ig ? `<a href="${c.ig}" target="_blank" class="modal-ig-btn"><svg viewBox="0 0 24 24"><use xlink:href="#icon-ig"></use></svg><span>前往 INSTAGRAM</span></a>` : ''}
                </div>
            `;

            document.getElementById('girl-modal').classList.add('active');
            document.body.classList.add('no-scroll'); 
        };

        window.closeModal = function() { 
            document.getElementById('girl-modal').classList.remove('active'); 
            document.body.classList.remove('no-scroll'); 
        };

        window.goToSchedule = function(team, sport) {
            closeModal();
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            let targetBtn = document.querySelector('.nav-btn.btn-schedule');
            if(targetBtn) targetBtn.classList.add('active');
            
            currentMode = 'schedule';
            currentScheduleTeam = team;
            currentScheduleSport = sport;
            
            document.getElementById('extra-filters').style.display = 'none';
            document.getElementById('filter-bar').style.display = 'none';
            document.getElementById('tabs-container').style.display = 'none';
            document.getElementById('sub-nav-sports').style.display = 'none';
            
            let cfgKey = teamThemes[`${team}_${sport}`] ? `${team}_${sport}` : team;
            let config = teamThemes[cfgKey] || teamThemes["全部啦啦隊"];
            document.documentElement.style.setProperty('--team-accent', config.accent);
            
            window.renderContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // =========================================================================
        // 班表系統 (大廳、電腦矩陣與手機卡片時間軸)
        // =========================================================================
        window.selectScheduleTeam = function(t, sp) { 
            currentScheduleTeam = t; currentScheduleSport = sp;
            let cfgKey = teamThemes[`${t}_${sp}`] ? `${t}_${sp}` : t;
            let config = teamThemes[cfgKey] || teamThemes["全部啦啦隊"];
            document.documentElement.style.setProperty('--team-accent', config.accent);
            window.renderContent(); 
        };
        
        window.backToScheduleSelection = function() { 
            currentScheduleTeam = null; 
            currentScheduleSport = null;
            // 修正：拔除舊版 applyTheme，改用直接恢復全域變數預設值
            document.documentElement.style.setProperty('--team-accent', '#ffeb3b'); 
            window.renderContent(); 
        };

        window.renderScheduleSelection = function() {
            const container = document.getElementById('schedule-container');
            let available = [];
            
            dbSchedules.forEach(s => { 
                if(s.team && !available.find(a => a.team === s.team && a.sport === s.sport)) {
                    available.push(s); 
                }
            });
            
            if (available.length === 0) {
               container.innerHTML = '<div style="text-align:center; padding:100px 50px; color:var(--text-sub); font-size:18px; font-weight:700;">目前沒有班表資料可以顯示！</div>';
               return;
            }

            let leagueGroups = { "CPBL 職業棒球": "#00b0ff", "TPBL 職籃聯盟": "#ff9800", "P. LEAGUE+ 職籃聯盟": "#ffeb3b", "職業排球": "#ff4081", "其他賽事活動": "#a0aec0" };
            let html = `<div class="schedule-selection-wrapper">`;
            
            for(let key in leagueGroups) {
                let teams = available.filter(a => {
                    const cfg = teamThemes[a.team+"_"+a.sport] || teamThemes[a.team] || {};
                    const l = cfg.league || "";
                    if(key === "其他賽事活動") return !l && !(a.sport||"").includes("棒球") && !(a.sport||"").includes("籃") && !(a.sport||"").includes("排球");
                    if(key.includes("CPBL")) return l === "CPBL" || (a.sport||"").includes("棒球");
                    if(key.includes("TPBL")) return l === "TPBL";
                    if(key.includes("P. LEAGUE+")) return l === "P. LEAGUE+";
                    if(key.includes("排球")) return l === "排球" || (a.sport||"").includes("排球");
                    return false;
                });
                
                if(teams.length) {
                    html += `<div class="schedule-league-section"><div class="schedule-league-title" style="background:${leagueGroups[key]}">${key}</div><div class="schedule-teams-grid">` +
                    teams.sort((a,b)=>a.team.localeCompare(b.team,'zh-TW')).map(t => {
                        const cfg = teamThemes[t.team+"_"+t.sport] || teamThemes[t.team] || { accent: "#fff" };
                        return `<div class="schedule-team-btn" style="--btn-accent:${cfg.accent}" onclick="window.selectScheduleTeam('${t.team}', '${t.sport}'); window.scrollTo({top:0});">
                            ${(cfg.logo && !cfg.noLogo)?`<img src="${cfg.logo}">`:''}<span>${t.team}</span>
                        </div>`;
                    }).join('') + `</div></div>`;
                }
            }
            container.innerHTML = html + `</div>`;
        };

        window.renderScheduleMatrix = function() {
            const container = document.getElementById('schedule-container');
            let data = dbSchedules.filter(s => s.team === currentScheduleTeam && s.sport === currentScheduleSport);
            
            const todayNum = parseInt(`${new Date().getFullYear()}${String(new Date().getMonth()+1).padStart(2,'0')}${String(new Date().getDate()).padStart(2,'0')}`);
            data = data.filter(s => s.safeDate.num >= todayNum);
            
            if(data.length === 0) {
                container.innerHTML = `<button class="back-btn" onclick="window.backToScheduleSelection()"><span><svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:3;vertical-align:middle;margin-right:5px;"><polyline points="15 18 9 12 15 6"></polyline></svg> 返回大廳 BACK</span></button><div style="text-align:center; padding:100px 50px; color:var(--text-sub); font-weight:700; font-size:18px;">此隊伍目前無未來班表資料。</div>`;
                return;
            }

            let girls = [...new Set(data.map(s => s.name))];
            
            girls.sort((nameA, nameB) => {
                const gA = girlMap.get(nameA) || {};
                const gB = girlMap.get(nameB) || {};
                
                const getNatWeight = (nat) => {
                    if ((nat || "").includes("韓國")) return 1;
                    if ((nat || "").includes("日本")) return 2;
                    if ((nat || "").includes("臺灣") || (nat || "").includes("台灣")) return 4;
                    return 3;
                };
                let wA = getNatWeight(gA.nat); let wB = getNatWeight(gB.nat);
                if (wA !== wB) return wA - wB;
                
                const isLastA = ((gA.note || gA['備註'] || gA.備註 || "").includes('練習生') || (gA.note || gA['備註'] || gA.備註 || "").includes('培訓生') || !gA.num || gA.num === "-") ? 1 : 0;
                const isLastB = ((gB.note || gB['備註'] || gB.備註 || "").includes('練習生') || (gB.note || gB['備註'] || gB.備註 || "").includes('培訓生') || !gB.num || gB.num === "-") ? 1 : 0;
                if (isLastA !== isLastB) return isLastA - isLastB;
                
                let nA = parseInt(String(gA.num || "").replace(/#/g, '')) || 999;
                let nB = parseInt(String(gB.num || "").replace(/#/g, '')) || 999;
                if (nA !== nB) return nA - nB;
                return nameA.localeCompare(nameB, 'zh-TW');
            });

            let dates = [...new Set(data.map(s => s.safeDate.num))].sort((a,b)=>a-b);
            const cfg = teamThemes[currentScheduleTeam+"_"+currentScheduleSport] || teamThemes[currentScheduleTeam] || { accent: "#fff" };

            let html = `<div style="width:100%; max-width: 1200px; margin: 0 auto;"><button class="back-btn" onclick="window.backToScheduleSelection()"><span><svg class="back-icon" viewBox="0 0 24 24"><use xlink:href="#icon-back"></use></svg>返回大廳 BACK</span></button>`;
            
            let desktopHtml = `<div class="schedule-desktop"><div class="schedule-wrapper"><table class="schedule-table"><thead><tr><th>ROSTER</th>` + 
                girls.map(n => {
                    const g = girlMap.get(n) || { realname: n, nickname: "" };
                    const showReal = g.realname;
                    const showNick = (g.nickname && g.nickname !== g.realname) ? g.nickname : "";
                    return `<th onclick="window.openModal('${n}')" style="cursor:pointer;"><div class="schedule-girl-col"><img src="${g.img||''}" class="schedule-girl-img" loading="lazy"><div class="schedule-girl-name-container"><span class="schedule-girl-name">${showReal}</span>${showNick ? `<span class="schedule-girl-nickname">${showNick}</span>` : ''}</div></div></th>`;
                }).join('') + `</tr></thead><tbody>`;
            
            let currentMonthDesk = "";
            dates.forEach(dNum => {
                const dInfo = data.find(s => s.safeDate.num === dNum).safeDate;
                if (dInfo.monStr !== currentMonthDesk) {
                    currentMonthDesk = dInfo.monStr;
                    desktopHtml += `<tr><td colspan="${girls.length + 1}" style="background: rgba(17,20,24,0.95); color: ${cfg.accent}; font-family: var(--sport-font); text-align: left; padding: 15px 25px; font-size: 22px; font-weight: 900; letter-spacing: 2px; border-bottom: 2px dashed ${cfg.accent}; position: sticky; left: 0; z-index: 2;">${currentMonthDesk} <span style="font-size:14px; color:var(--text-sub); font-family:var(--tc-font); margin-left: 5px;">${dInfo.year}</span></td></tr>`;
                }
                
                desktopHtml += `<tr><td><div class="schedule-date">${dInfo.month}/${String(dInfo.day).padStart(2,'0')}</div><div class="schedule-day">${dInfo.week}</div></td>` +
                    girls.map(gn => {
                        const work = data.some(s => s.safeDate.num === dNum && s.name === gn);
                        return `<td>${work?`<svg class="schedule-heart" style="color:${cfg.accent};"><use xlink:href="#icon-heart"></use></svg>`:''}</td>`;
                    }).join('') + `</tr>`;
            });
            desktopHtml += `</tbody></table></div></div>`;

            let mobileHtml = `<div class="schedule-mobile">`;
            let currentMonthMob = "";
            
            dates.forEach(dNum => {
                const dInfo = data.find(s => s.safeDate.num === dNum).safeDate;
                let attendees = girls.filter(gn => data.some(s => s.safeDate.num === dNum && s.name === gn));
                
                if (attendees.length > 0) {
                    if (dInfo.monStr !== currentMonthMob) {
                        currentMonthMob = dInfo.monStr;
                        mobileHtml += `<div style="font-family: var(--sport-font); color: ${cfg.accent}; font-size: 24px; font-weight: 900; letter-spacing: 2px; margin: 15px 0 5px; padding-bottom: 5px; border-bottom: 2px solid ${cfg.accent}; display:flex; align-items:baseline; gap:10px;">${currentMonthMob} <span style="font-size:14px; color:var(--text-sub); font-family:var(--tc-font); font-weight:700;">${dInfo.year}</span></div>`;
                    }
                    
                    mobileHtml += `<div class="timeline-card" style="--team-accent:${cfg.accent}">
                        <div class="timeline-date">${dInfo.month}/${String(dInfo.day).padStart(2,'0')} <span style="font-size:13px;color:var(--text-sub);">${dInfo.week}</span></div>
                        <div class="timeline-roster">`;
                    
                    attendees.forEach(gn => {
                        const g = girlMap.get(gn) || { realname: gn, nickname: "" };
                        const showReal = g.realname;
                        const showNick = (g.nickname && g.nickname !== g.realname) ? g.nickname : "";
                        mobileHtml += `<div class="timeline-girl" onclick="window.openModal('${showReal}')" style="align-items:center; display:flex;">
                            <img src="${g.img||''}" loading="lazy">
                            <div style="display:flex; flex-direction:column; line-height:1.2;">
                                <span>${showReal}</span>
                                ${showNick ? `<span style="font-size:10px; color:var(--team-accent);">${showNick}</span>` : ''}
                            </div>
                        </div>`;
                    });
                    mobileHtml += `</div></div>`;
                }
            });
            mobileHtml += `</div>`;

            container.innerHTML = html + desktopHtml + mobileHtml + `</div>`;
        };

        // =========================================================================
        // ✨ 同一天聚合的「日曆方塊卡」(外籍行程)
        // =========================================================================
        window.renderEvents = function() {
            const search = (document.getElementById('searchInput').value || "").toLowerCase().trim();
            const todayNum = parseInt(`${new Date().getFullYear()}${String(new Date().getMonth()+1).padStart(2,'0')}${String(new Date().getDate()).padStart(2,'0')}`);
            
            let filtered = dbEvents.map((e, index) => ({ ...e, originalIndex: index })).filter(e => {
                if (search === "") return true;
                const girlsStr = (e.girls || "").toLowerCase();
                if ((e.eventname||"").toLowerCase().includes(search) || girlsStr.includes(search) || (e.host||"").toLowerCase().includes(search)) return true;
                return dbGirls.some(g => (g.nickname||"").toLowerCase().includes(search) && girlsStr.includes((g.realname||"").toLowerCase()));
            });
            
            filtered.sort((a,b) => a.safeDate.num - b.safeDate.num);
            const up = filtered.filter(e => e.safeDate.num >= todayNum); 
            const ex = filtered.filter(e => e.safeDate.num < todayNum).reverse(); 
            
            function groupEventsByDate(eventsArray) {
                const map = new Map();
                eventsArray.forEach(e => {
                    const key = e.safeDate.num;
                    if (!map.has(key)) { map.set(key, { date: e.safeDate, events: [] }); }
                    map.get(key).events.push(e);
                });
                return Array.from(map.values());
            }

            const buildDateCard = (group, isExp) => {
                const { date, events } = group;
                
                const slotsHtml = events.map(e => {
                    const attendGirls = (e.girls || "").split(/[,\s、，\n]+/).map(n => n.trim()).filter(n => n);
                    const displayGirls = attendGirls.slice(0, 3);
                    const avatarsHtml = displayGirls.map(n => {
                        const g = girlMap.get(n);
                        return g 
                            ? `<img src="${g.img}" class="event-mini-avatar" loading="lazy">` 
                            : `<div class="event-mini-avatar default-avatar" style="width:36px;height:36px;margin-left:-8px;"><svg viewBox="0 0 24 24"><use xlink:href="#icon-user"></use></svg></div>`;
                    }).join('');
                    
                    const moreBadge = attendGirls.length > 3 
                        ? `<div class="event-mini-avatar" style="display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;background:#333;">+${attendGirls.length-3}</div>` 
                        : '';

                    return `
                    <div class="event-slot-item" onclick="window.openEventModal(${e.originalIndex})">
                        <div class="event-slot-title">${e.eventname || "活動賽事"}</div>
                        <div class="event-mini-avatars">
                            ${avatarsHtml}${moreBadge}
                        </div>
                    </div>`;
                }).join('');

                return `
                <div class="event-date-card ${isExp?'expired':''}">
                    <div class="event-date-header">
                        <div class="event-date-month">${date.monStr}</div>
                        <div class="event-date-day">${String(date.day).padStart(2,'0')}</div>
                        <div style="font-size:11px; color:var(--text-sub); margin-top:2px;">${date.week}</div>
                    </div>
                    <div class="event-slots-container">
                        ${slotsHtml}
                    </div>
                </div>`;
            };

            const groupedUp = groupEventsByDate(up);
            const groupedEx = groupEventsByDate(ex);

            let html = groupedUp.length 
                ? `<div class="event-grid">${groupedUp.map(g=>buildDateCard(g,false)).join('')}</div>` 
                : (search===""?'<div style="text-align:center;padding:100px 50px;color:var(--text-sub); font-weight:700; width:100%;">目前沒有近期的活動賽事。</div>':'');
            
            if(groupedEx.length) {
                html += `<div class="event-section-divider">歷史賽事紀錄 ARCHIVE</div><div class="event-grid">${groupedEx.map(g=>buildDateCard(g,true)).join('')}</div>`;
            }
            
            document.getElementById('event-container').innerHTML = html;
        };

        // =========================================================================
        // 賽事專屬彈窗
        // =========================================================================
        window.openEventModal = function(index) {
            const e = dbEvents[index];
            if(!e) return;
            
            const attendGirls = (e.girls || "").split(/[,\s、，\n]+/).map(n => n.trim()).filter(n => n);
            const attendHtml = attendGirls.map(n => {
                const g = girlMap.get(n);
                return `
                <div class="girl-hero-card" onclick="window.openModal('${g?g.realname:n}')" style="width:80px; padding: 5px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);">
                    <div class="girl-hero-img-wrap" style="width:65px; height:65px; box-shadow:none;">
                        ${g?`<img src="${g.img}" class="girl-hero-img" loading="lazy">`:`<div class="girl-hero-img default-avatar"><svg viewBox="0 0 24 24"><use xlink:href="#icon-user"></use></svg></div>`}
                    </div>
                    <div class="girl-hero-name-container">
                        <span class="girl-hero-name" style="font-size:13px;">${g?g.realname:n}</span>
                    </div>
                </div>`;
            }).join('');

            const addressRaw = (e.address || "").trim();
            const addressDisplay = addressRaw 
                ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addressRaw)}" target="_blank" style="color:var(--event-accent); text-decoration:none; border-bottom:1px dashed var(--event-accent); transition:0.2s;">${addressRaw}</a>`
                : "請見球團官網";

            let key = 'event|' + e.safeDate.num + '|' + (e.eventname||"");
            let isSaved = schedSet.has(key);
            let dateStr = `${e.safeDate.monStr}/${String(e.safeDate.day).padStart(2,'0')}`;
            let saveBtnHtml = `<button onclick="window.toggleMySchedule('${key}', ${e.safeDate.num}, '${dateStr}', '${e.eventname||"外籍行程"}', event, this);" style="display:block; width:100%; padding:16px; margin-top:20px; font-weight:900; background:${isSaved?'var(--fav-accent)':'#15191e'}; color:#fff; border:2px solid ${isSaved?'transparent':'#2d3748'}; border-radius:4px; font-family:var(--sport-font); letter-spacing:1px; box-shadow: 6px 6px 0px rgba(0,0,0,0.8); cursor:pointer; transition:0.2s;">${isSaved?'➖ 已加入專屬行程 (點擊移除)':'➕ 加入我的專屬行事曆'}</button>`;

            document.documentElement.style.setProperty('--modal-accent', 'var(--event-accent)'); 

            document.getElementById('modal-dynamic-content').innerHTML = `
                <div class="modal-body" style="padding-top: 40px;">
                    <div style="text-align:center; margin-bottom:25px;">
                        <div style="font-family:var(--sport-font); font-size:18px; color:var(--event-accent); font-weight:900; letter-spacing:2px;">${e.safeDate.monStr} / ${e.safeDate.year}</div>
                        <div style="font-family:var(--sport-font); font-size:65px; color:#fff; font-weight:900; line-height:1; margin:5px 0;">${String(e.safeDate.day).padStart(2,'0')}</div>
                        <div style="font-size:14px; color:var(--text-sub); font-weight:700; letter-spacing:1px;">${e.safeDate.week}</div>
                    </div>
                    
                    <div class="modal-nickname" style="color:var(--event-accent); font-size:24px; text-align:center; margin-bottom:30px; word-break: break-word;">${e.eventname || "賽事活動未定"}</div>
                    
                    <div class="stats-grid" style="margin-bottom: 30px;">
                        <div class="stat-box"><span class="stat-label">時間 TIME</span><span class="stat-value" style="font-size:16px;">${e.time||"TBA"}</span></div>
                        <div class="stat-box"><span class="stat-label">主辦 HOST</span><span class="stat-value" style="font-size:14px; font-family:var(--tc-font);">${e.host||"-"}</span></div>
                        <div class="stat-box" style="grid-column: 1 / -1; border-right: none; padding-top: 15px; padding-bottom: 15px;"><span class="stat-label">地點 LOCATION</span><span class="stat-value" style="font-size:14px; font-family:var(--tc-font);">${addressDisplay}</span></div>
                    </div>

                    <div style="font-family:var(--sport-font); font-size:16px; font-weight:900; color:#fff; border-bottom:2px dashed var(--border-color); padding-bottom:10px; margin-bottom:20px; letter-spacing:1px; transform: skewX(-5deg);">出席女孩 GIRLS <span style="font-size:11px; color:var(--text-sub); font-family:var(--tc-font); font-weight:normal;">(點擊查看檔案)</span></div>
                    <div style="display:flex; flex-wrap:wrap; gap:12px; justify-content:center;">
                        ${attendHtml || '<div style="color:var(--text-sub); font-size:13px; font-weight:700;">目前尚未公布名單</div>'}
                    </div>
                    ${saveBtnHtml}
                </div>
            `;

            document.getElementById('girl-modal').classList.add('active');
            document.body.classList.add('no-scroll'); 
        };

        // =========================================================================
        // 🎮 殘酷二選一 (Minigame) 遊戲引擎
        // =========================================================================
        let mgQueue = [];
        let mgNextQueue = [];
        let mgRound = 16;
        let mgMatchCount = 0;
        let mgTotalMatches = 0;

        window.renderMinigameStart = function() {
            const container = document.getElementById('minigame-container');
            container.innerHTML = `
                <div class="game-title">殘酷二選一：找出你的絕對本命</div>
                <div style="color:var(--text-sub); font-size:16px; font-weight:700;">選擇賽區，系統將隨機抽出女孩進行淘汰賽！</div>
                <div class="game-mode-grid">
                    <button class="game-mode-btn" onclick="window.startMinigame('tw')"><span>🇹🇼</span> 本土大戰<div style="font-size:14px; color:var(--text-sub);">台灣女孩</div></button>
                    <button class="game-mode-btn" onclick="window.startMinigame('foreign')"><span>✈️</span> 外籍傭兵<div style="font-size:14px; color:var(--text-sub);">日韓等外籍常駐應援女孩</div></button>
                    <button class="game-mode-btn" style="border-color:#9c27b0;" onclick="window.startMinigame('all')"><span>🌍</span> 終極大亂鬥<div style="font-size:14px; color:var(--text-sub);">全圖鑑隨機無差別</div></button>
                </div>
            `;
        };

        window.startMinigame = function(type) {
            // 過濾唯一實名，並將她所屬的所有運動項目合併起來
            let uniqueMap = new Map();
            dbGirls.forEach(g => { 
                if(!uniqueMap.has(g.realname)) {
                    uniqueMap.set(g.realname, { ...g, allSports: (g.sport || "") });
                } else {
                    let e = uniqueMap.get(g.realname);
                    e.allSports += " " + (g.sport || ""); 
                }
            });
            let pool = Array.from(uniqueMap.values());

            // 依條件篩選賽區
            if(type === 'tw') {
                pool = pool.filter(g => (g.nat||"").includes("臺") || (g.nat||"").includes("台") || (g.team||"").toLowerCase().includes("luxygirls"));
            } else if (type === 'foreign') {
                pool = pool.filter(g => {
                    let isForeign = g.nat && !(g.nat||"").includes("臺") && !(g.nat||"").includes("台") && g.nat !== "未知" && g.nat !== "-";
                    let isMainSport = g.allSports.includes("棒") || g.allSports.includes("籃") || g.allSports.includes("排");
                    return isForeign && isMainSport;
                });
            } else if (type === 'all') {
                pool = pool.filter(g => g.img); // 只要有圖就上
            }

            // 隨機洗牌抽籤
            pool.sort(() => Math.random() - 0.5);

            // 決定局數 (優先取 32 人來貼近 20 題，不夠就 16，再不夠就 8)
            mgRound = pool.length >= 32 ? 32 : (pool.length >= 16 ? 16 : (pool.length >= 8 ? 8 : 0));
            if(mgRound === 0) { alert("該賽區女孩數量不足以舉辦淘汰賽！(至少需要 8 人)"); return; }

            mgQueue = pool.slice(0, mgRound);
            mgNextQueue = [];
            mgTotalMatches = mgRound / 2;
            mgMatchCount = 1;
            
            renderMinigameMatch();
        };

        window.renderMinigameMatch = function() {
            const container = document.getElementById('minigame-container');
            
            // 換輪次判斷
            if (mgQueue.length === 0) {
                if (mgNextQueue.length === 1) {
                    renderMinigameWinner(mgNextQueue[0]);
                    return;
                } else {
                    mgQueue = [...mgNextQueue];
                    mgNextQueue = [];
                    mgRound = mgQueue.length;
                    mgTotalMatches = mgRound / 2;
                    mgMatchCount = 1;
                }
            }

            const girlA = mgQueue.pop();
            const girlB = mgQueue.pop();

            // 如果有落單的直接晉級
            if(!girlB) { mgNextQueue.push(girlA); renderMinigameMatch(); return; }

            window.currentMgMatch = { A: girlA, B: girlB };
            let roundTitle = mgRound === 2 ? '🏆 終極決賽 FINAL' : `🔥 ${mgRound} 強賽`;

            container.innerHTML = `
                <div class="game-title" style="margin-bottom:5px;">${roundTitle}</div>
                <div style="color:var(--text-sub); font-size:16px; font-weight:900; margin-bottom:15px; font-family:var(--sport-font); letter-spacing:1px;">MATCH ${mgMatchCount} / ${mgTotalMatches}</div>
                
                <div class="vs-container">
                    ${createMinigameCard(girlA, 'A')}
                    <div class="vs-badge">VS</div>
                    ${createMinigameCard(girlB, 'B')}
                </div>
            `;
        };

        function createMinigameCard(g, choice) {
            const accent = (teamThemes[g.team] || {accent:"#fff"}).accent;
            
            // ✨ 國籍智慧分流
            const isTaiwanese = (g.nat || "").includes("臺") || (g.nat || "").includes("台");
            const mainName = isTaiwanese ? ((g.nickname && g.nickname !== g.realname) ? g.nickname : g.realname) : g.realname;
            const subNameText = isTaiwanese ? '' : ((g.nickname && g.nickname !== g.realname) ? g.nickname : '');
            
            const showNick = subNameText ? `<div style="font-size:18px; color:${accent}; font-weight:700; margin-bottom:5px;">${subNameText}</div>` : '';

            return `
            <div class="vs-card" style="--team-accent: ${accent};" onclick="window.pickMinigameWinner('${choice}')">
                <img src="${window.getCdnUrl(g.img)}" onerror="this.onerror=null; this.src='${g.img}';">
                <div class="vs-info">
                    <div class="vs-name">${mainName}</div>
                    ${showNick}
                    <div class="vs-team" style="color: ${accent};">${g.team}</div>
                </div>
            </div>`;
        }

        window.pickMinigameWinner = function(choice) {
            const winner = choice === 'A' ? window.currentMgMatch.A : window.currentMgMatch.B;
            mgNextQueue.push(winner);
            mgMatchCount++;
            renderMinigameMatch();
        };

        window.renderMinigameWinner = function(g) {
            const container = document.getElementById('minigame-container');
            const accent = (teamThemes[g.team] || {accent:"#fff"}).accent;
            const isFav = favSet.has(g.realname);
            
            // ✨ 國籍智慧分流
            const isTaiwanese = (g.nat || "").includes("臺") || (g.nat || "").includes("台");
            const mainName = isTaiwanese ? ((g.nickname && g.nickname !== g.realname) ? g.nickname : g.realname) : g.realname;
            const subNameText = isTaiwanese ? '' : ((g.nickname && g.nickname !== g.realname) ? g.nickname : '');
            
            const showNick = subNameText ? `<div style="font-size:20px; color:${accent}; font-weight:700; text-align:center; margin-top:5px;">${subNameText}</div>` : '';
            
            container.innerHTML = `
                <div class="game-title">👑 你的絕對本命誕生</div>
                <div style="color:var(--text-sub); font-size:16px; font-weight:700; margin-bottom:30px;">經歷殘酷的淘汰賽，她就是你的最終選擇！</div>
                
                <div class="card winner-card" style="border-bottom: 6px solid ${accent}; --team-accent: ${accent}; pointer-events: none;">
                    <div class="photo-area">
                        <img src="${window.getCdnUrl(g.img)}" onerror="this.onerror=null; this.src='${g.img}';">
                    </div>
                    <div class="info-section">
                        <div style="font-size:28px; font-weight:900; color:${accent}; text-align:center;">${mainName}</div>
                        ${showNick}
                        <div style="color:var(--text-sub); font-weight:700; text-align:center; margin-top:5px;">${g.team}</div>
                    </div>
                </div>

                <div style="display:flex; justify-content:center; gap:15px; margin-top:40px; flex-wrap:wrap;">
                    <button class="nav-btn active" style="background:${isFav?'#111418':accent}; border-color:${isFav?'var(--border-color)':accent}; color:${isFav?'var(--text-sub)':'#111'};" onclick="window.toggleFavorite('${g.realname}', event, this); this.innerText=this.innerText.includes('已經')?'❤️ 加入我的最愛':'❤️ 已經是你的最愛了'; this.style.background=this.style.background.includes('17')?'${accent}':'#111418'; this.style.color=this.style.color.includes('17')?'#111':'var(--text-sub)';">${isFav?'❤️ 已經是你的最愛了':'❤️ 加入我的最愛'}</button>
                    <button class="nav-btn" onclick="window.renderMinigameStart()">🔄 再玩一次</button>
                </div>
            `;
            if(typeof createConfetti === 'function') createConfetti();
        };

        function createConfetti() {
            for(let i=0; i<50; i++) {
                let conf = document.createElement('div');
                conf.style.position = 'fixed';
                conf.style.width = '10px';
                conf.style.height = '10px';
                conf.style.backgroundColor = ['#ffeb3b', '#ff4757', '#00e676', '#03a9f4', '#e040fb'][Math.floor(Math.random()*5)];
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = '-10px';
                conf.style.zIndex = '999999';
                conf.style.pointerEvents = 'none';
                conf.style.animation = `fall ${Math.random() * 3 + 2}s linear forwards`;
                document.body.appendChild(conf);
                setTimeout(()=>conf.remove(), 5000);
            }
            if(!document.getElementById('confetti-style')) {
                let style = document.createElement('style');
                style.id = 'confetti-style';
                style.innerHTML = `@keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }`;
                document.head.appendChild(style);
            }
        }

        window.addEventListener('scroll', function() {
            const topBtn = document.getElementById('backToTopBtn');
            if (topBtn) {
                if (window.scrollY > 300) {
                    topBtn.classList.add('show');
                } else {
                    topBtn.classList.remove('show');
                }
            }
        });

        window.scrollToTop = function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => {});
            });
        }

        window.onload = loadData;
    </script>
</body>
</html>
