    <script async src="https://www.googletagmanager.com/gtag/js?id=G-19L6EYRWKE"></script>
    <script> 
        // ⚡ GitHub 轉 jsDelivr 極速加速器 (強化精準解析版)
        window.getCdnUrl = function(url) {
            if (!url || typeof url !== 'string') return url;
            
            // 針對 GitHub Raw 網址進行嚴格的格式轉換
            if (url.includes('raw.githubusercontent.com')) {
                try {
                    let urlObj = new URL(url);
                    // 切割網址路徑
                    let parts = urlObj.pathname.split('/').filter(p => p !== '');
                    if (parts.length >= 4) {
                        let user = parts[0];
                        let repo = parts[1];
                        let branch = parts[2];
                        let filePath = parts.slice(3).join('/');
                        // jsDelivr 的正確格式：cdn.jsdelivr.net/gh/帳號/倉庫@分支/檔案路徑
                        return `https://cdn.jsdelivr.net/gh/${user}/${repo}@${branch}/${filePath}`;
                    }
                } catch(e) {
                    return url; // 如果解析失敗，安全退回原網址
                }
            }
            // 如果不是 GitHub Raw 網址，就保持原樣 (例如 Google Drive 或 FB 圖片)
            return url;
        };
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-19L6EYRWKE');
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Oswald:wght@400;700;900&display=swap');

        :root {
            --bg-panel: #111418;
            --bg-card: #1c2128;
            --text-main: #f0f4f8;
            --text-sub: #a0aec0;
            --border-color: #2d3748;
            
            /* 主題變數 (會被 JS 動態覆寫) */
            --team-accent: #ffffff;
            --event-accent: #ff5722;
            --schedule-accent: #00e676;
            --fav-accent: #ff4757;
            --theme-glow: transparent;
            --header-border: #2d3748;
            
            --sport-font: 'Oswald', sans-serif;
            --tc-font: 'Noto Sans TC', sans-serif;
        }

        * { box-sizing: border-box; font-family: var(--tc-font); margin: 0; padding: 0; }

        html, body { max-width: 100vw; overflow-x: hidden; background-color: color-mix(in srgb, var(--theme-glow, #333) 10%, #050505); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; scroll-behavior: smooth; transition: background-color 0.5s ease; }
        body.no-scroll { overflow: hidden !important; }

        .sports-bg-slider { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; background: #000; overflow: hidden; }
        /* 背景漸層混入 15% 本命色 */
        .sports-bg-slider::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(135deg, color-mix(in srgb, var(--theme-glow, #333) 15%, rgba(10,12,16,0.95)) 0%, rgba(20,25,30,0.9) 100%); z-index: 2; pointer-events: none; transition: background 0.5s ease;}
        /* 頂部打光特效，散發 35% 濃度的本命光晕 */
        .sports-bg-slider::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% -20%, color-mix(in srgb, var(--theme-glow, #333) 35%, transparent) 0%, transparent 70%); z-index: 3; pointer-events: none; transition: background 0.5s ease; mix-blend-mode: screen;}
        
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; filter: grayscale(30%) contrast(110%); animation: slideFade 24s infinite; z-index: 1; }
        .slide-1 { background-image: url('https://images.unsplash.com/photo-1511886929837-354d827aae26?q=80&w=2000&auto=format&fit=crop'); animation-delay: 0s; } 
        .slide-2 { background-image: url('https://images.unsplash.com/photo-1546519638-68e109498ffc?q=80&w=2000&auto=format&fit=crop'); animation-delay: 8s; } 
        .slide-3 { background-image: url('https://images.unsplash.com/photo-1593787406536-369656f37fb2?q=80&w=2000&auto=format&fit=crop'); animation-delay: 16s; } 
        @keyframes slideFade { 0% { opacity: 0; transform: scale(1.05); } 10% { opacity: 0.4; transform: scale(1); } 33% { opacity: 0.4; transform: scale(1); } 43% { opacity: 0; transform: scale(1.05); } 100% { opacity: 0; } }

        .landing-page { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #1a1a24 0%, #050505 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; transition: opacity 0.5s ease; }
        .landing-content { text-align: center; animation: fadeInUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .landing-title { font-size: 3.5rem; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; text-shadow: 4px 4px 0px var(--event-accent); margin-bottom: 5px; transform: skewX(-5deg);}
        .landing-subtitle { font-family: var(--sport-font); font-size: 1.2rem; color: var(--text-sub); margin-bottom: 50px; letter-spacing: 4px; text-transform: uppercase; }
        .enter-btn { font-family: var(--sport-font); background: #fff; color: #000; padding: 15px 50px; font-size: 1.5rem; font-weight: 900; border: none; border-radius: 2px; transform: skewX(-10deg); cursor: pointer; box-shadow: 6px 6px 0px var(--event-accent); transition: all 0.2s; letter-spacing: 2px; display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 auto; }
        .enter-btn:hover:not(:disabled) { background: var(--event-accent); color: #fff; transform: skewX(-10deg) translate(-4px, -4px); box-shadow: 10px 10px 0px rgba(255,87,34,0.3); }
        .enter-btn:disabled { background: #333; color: #888; cursor: not-allowed; box-shadow: none; }
        .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; transform: skewX(10deg); }
        @keyframes spin { to { transform: skewX(10deg) rotate(360deg); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        .floating-hub-btn { position: fixed; bottom: 30px; left: 30px; width: 55px; height: 55px; background: var(--event-accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 100; cursor: pointer; box-shadow: 0 5px 20px rgba(0,0,0,0.5); transition: 0.3s; border: 2px solid #fff; }

        .floating-hub-btn svg { width: 28px; height: 28px; fill: #fff; }

        .hub-panel-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px; }
        .hub-panel-overlay.active { display: flex; }
        .hub-content { background: var(--bg-panel); border: 2px solid var(--event-accent); border-radius: 12px; width: 100%; max-width: 420px; padding: 30px; position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.5); overflow-y: auto; max-height: 85vh; }
        .hub-close { position: absolute; top: 15px; right: 15px; width: 35px; height: 35px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 20px; }

        .hub-section { margin-bottom: 30px; }
        .hub-title { font-family: var(--sport-font); font-size: 18px; color: var(--event-accent); font-weight: 900; letter-spacing: 2px; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        
        .lucky-girl-box { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: 0.2s; }

        .lucky-name { font-size: 20px; font-weight: 900; color: #fff; margin-bottom: 4px; }

        .mvp-box:hover { background: linear-gradient(90deg, rgba(255,255,255,0.1), transparent); transform: translateX(5px); }
        .mvp-text { font-size: 14px; font-weight: 700; color: #fff; line-height: 1.6; }

        .birthday-item { width: 72px; text-align: center; cursor: pointer; transition: 0.2s; }

        .birthday-img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; object-position: top center; border: 2px solid #fff; margin-bottom: 6px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .birthday-name { font-size: 13px; font-weight: 700; color: #fff; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .birthday-date { font-size: 11px; color: var(--event-accent); font-family: var(--sport-font); margin-top: 3px; font-weight: 700;}

        /* Header 加入動態邊框顏色變數 */
        .header { background-color: rgba(17, 20, 24, 0.95); padding: 25px 20px 0; border-bottom: 4px solid var(--header-border); z-index: 50; position: relative; transition: border-color 0.5s ease;}
        .title { font-size: 28px; font-weight: 900; text-align: center; margin-bottom: 25px; letter-spacing: 3px; color: #fff; text-transform: uppercase; }
        .controls-container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; padding-bottom: 15px; }
        
        .main-nav { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .nav-btn { font-family: var(--sport-font); background: var(--bg-card); border: 2px solid var(--border-color); color: var(--text-sub); padding: 12px 25px; font-size: 15px; font-weight: 900; border-radius: 4px; cursor: pointer; transition: all 0.2s; transform: skewX(-5deg); letter-spacing: 1px;}
        .nav-btn span { transform: skewX(5deg); display: inline-flex; align-items: center; gap: 8px; }
        .nav-btn:hover { border-color: #fff; color: #fff; transform: skewX(-5deg) translateY(-2px); box-shadow: 4px 4px 0px rgba(255,255,255,0.2); }
        .nav-btn.active { background: #fff; color: #000; border-color: #fff; box-shadow: 4px 4px 0px rgba(255,255,255,0.3); }
        .nav-btn.btn-fav.active { background: var(--schedule-accent); border-color: var(--schedule-accent); color: #000; box-shadow: 4px 4px 0px rgba(0,230,118,0.3); }
        .nav-btn.btn-schedule.active { background: var(--schedule-accent); border-color: var(--schedule-accent); color: #000; box-shadow: 4px 4px 0px rgba(0,230,118,0.3); }
        .nav-btn.btn-event.active { background: var(--event-accent); border-color: var(--event-accent); color: #000; box-shadow: 4px 4px 0px rgba(255,87,34,0.3); }
        /* 遊戲按鈕樣式 */
        .btn-game.active { background: #9c27b0; border-color: #9c27b0; color: #fff; box-shadow: 4px 4px 0px rgba(156,39,176,0.3); }
        .btn-icon { width: 18px; height: 18px; fill: currentColor; }

        .sub-nav { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding-top: 18px; margin-top: 5px; border-top: 2px dashed var(--border-color); }
        .sub-btn { font-family: var(--tc-font); background: transparent; border: 1px solid var(--text-sub); color: var(--text-sub); padding: 6px 18px; font-size: 13px; font-weight: 900; border-radius: 30px; cursor: pointer; transition: 0.2s; letter-spacing: 1px;}
        .sub-btn:hover { border-color: #fff; color: #fff; transform: translateY(-2px);}
        .sub-btn.active { background: var(--text-sub); color: #000; border-color: var(--text-sub); }

        .team-tabs { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding-top: 15px; border-top: 2px dashed var(--border-color); }
        .league-group { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 8px; }
        .league-title { font-family: var(--sport-font); font-size: 12px; font-weight: 700; color: var(--text-sub); background: rgba(255,255,255,0.05); padding: 4px 16px; border-radius: 20px; text-transform: uppercase; letter-spacing: 2px; margin: 5px 0; border: 1px solid rgba(255,255,255,0.1); }
        
        .tab-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-sub); cursor: pointer; font-size: 13px; font-weight: 700; border-radius: 30px; transition: all 0.2s; display: inline-flex; flex-direction: row; align-items: center; justify-content: center; gap: 8px; padding: 8px 20px; height: auto; min-width: auto; }
        .tab-btn:hover { background: #252c36; transform: translateY(-2px); color: #fff; border-color: var(--team-accent); }
        .tab-btn.active { background-color: var(--team-accent); color: #111; font-weight: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-color: var(--team-accent); transform: translateY(-2px); }
        .tab-logo { width: 20px; height: 20px; object-fit: contain; display: block; }

        .sticky-filter-wrapper { position: sticky; top: 0; z-index: 40; background: rgba(17, 20, 24, 0.98); padding: 15px 20px; border-bottom: 2px solid var(--border-color); box-shadow: 0 10px 20px rgba(0,0,0,0.7); }
        .filters { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; max-width: 1200px; margin: 0 auto; }
        .filters input, .filters select { background-color: var(--bg-card); border: 2px solid var(--border-color); color: var(--text-main); padding: 11px 16px; font-size: 14px; font-weight: 700; border-radius: 2px; outline: none; transition: all 0.2s;}
        .filters input:focus, .filters select:focus { border-color: #fff; background-color: #252c36; }

        #main-content { flex: 1; padding-top: 15px; position: relative; }
        .grid-container { max-width: 1200px; width: 100%; margin: 30px auto 60px; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .card { background-color: var(--bg-card); border: 2px solid var(--border-color); border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; transition: all 0.2s; box-shadow: 8px 8px 0px rgba(0,0,0,0.6); cursor: pointer; position: relative; }
        .card:hover { transform: translate(-4px, -4px); box-shadow: 12px 12px 0px rgba(0,0,0,0.8); border-color: #fff; }
        
        .photo-area { height: 350px; background-color: #000; overflow: hidden; position: relative; border-bottom: 4px solid var(--border-color); }
        .photo-area img { width: 100%; height: 100%; object-fit: cover; object-position: top center; transition: transform 0.5s; }
        .card:hover .photo-area img { transform: scale(1.05); }

        .sport-tags { position: absolute; top: 15px; left: 15px; display: flex; flex-direction: row; z-index: 5; }
        .sport-tag { width: 30px; height: 30px; border-radius: 50%; box-shadow: 2px 2px 6px rgba(0,0,0,0.6); cursor: help; background-size: cover; background-repeat: no-repeat; background-position: center; border: 2px solid #fff; background-color: #fff; margin-left: -10px; transition: 0.2s; position: relative; }
        .sport-tag:first-child { margin-left: 0; }
        .sport-tag:hover { transform: translateY(-4px) scale(1.1); z-index: 10; box-shadow: 2px 6px 12px rgba(0,0,0,0.8); }
        
        .tag-baseball { background-image: url('./baseball.png'); } 
        .tag-basketball { background-image: url('./basketball-ball.png'); } 
        .tag-volleyball { background-image: url('./vollyball.png'); }
        .tag-other { background-color: #8e44ad; background-image: none; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; font-weight: 900; letter-spacing: 1px; font-family: var(--tc-font); border-color: #fff; } 

        .fav-btn { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10; box-shadow: 0 3px 8px rgba(0,0,0,0.6); transition: 0.2s; cursor: pointer;}
        .fav-btn:hover { transform: scale(1.15); background: var(--fav-accent); }
        .fav-icon { width: 16px; height: 16px; fill: #b0bec5; transition: 0.2s; }
        .fav-btn:hover .fav-icon { fill: #fff; }
        .fav-btn.active { background: var(--fav-accent); }
        .fav-btn.active .fav-icon { fill: #fff; animation: heartPop 0.3s; }

        .info-section { padding: 25px; background: var(--bg-card); display: flex; flex-direction: column; flex: 1; }
        .header-info { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 2px dashed var(--border-color); }
        .nickname-container { display: flex; align-items: center; gap: 8px; }
        .nickname { font-size: 24px; font-weight: 900; color: var(--team-accent, #fff); line-height: 1; text-transform: uppercase; }
        .realname { font-size: 14px; color: var(--text-sub); margin-top: 8px; font-weight: 700; letter-spacing: 1px; }
        .number { font-family: var(--sport-font); font-size: 20px; font-weight: 900; color: var(--team-accent, #ffeb3b); background: #111418; padding: 4px 12px; border-radius: 4px; border: 2px solid var(--border-color); transform: skewX(-5deg); box-shadow: 3px 3px 0px rgba(0,0,0,0.5); text-align: center; }

        .data-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: auto; }
        .data-row { display: flex; justify-content: space-between; font-size: 14px; align-items: flex-start; gap: 10px; }
        .data-label { color: var(--text-sub); font-weight: 700; white-space: nowrap; flex-shrink: 0; }
        .data-value { font-weight: 900; color: #fff; text-align: right; font-family: var(--sport-font); letter-spacing: 0.5px; font-size: 15px; word-break: break-word; }

        .team-tags-wrapper { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; flex: 1; margin-left: 10px;}
        .team-tag-mini { padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 900; background: rgba(255,255,255,0.05); border: 1px solid currentColor; line-height: 1.2; text-align: center; }
        .modal-data-row .team-tag-mini { font-size: 14px; padding: 4px 12px; }

        .stats-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 15px 0; border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; background: #111418; box-shadow: inset 0 2px 8px rgba(0,0,0,0.5); }
        .stat-box { padding: 12px 5px; text-align: center; display: flex; flex-direction: column; justify-content: center; border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); }
        .stat-box:nth-child(even) { border-right: none; }
        .stat-box:nth-child(n+3) { border-bottom: none; }
        .stat-label { font-size: 11px; color: var(--text-sub); font-weight: 700; margin-bottom: 6px; letter-spacing: 1px; }
        .stat-value { font-size: 15px; font-weight: 900; color: #fff; font-family: var(--sport-font); letter-spacing: 0.5px; }
        .note-box { margin-top: 10px; padding: 12px 15px; background: rgba(255, 87, 34, 0.1); border-left: 4px solid var(--event-accent); font-size: 13px; color: #cbd5e1; font-weight: 700; line-height: 1.5; border-radius: 0 4px 4px 0; }

        .ig-link { display: inline-flex; vertical-align: middle; transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0.9; filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.8)); margin-left: 10px; }
        .ig-link:hover { transform: scale(1.2) rotate(-5deg); opacity: 1; filter: drop-shadow(0 0 8px rgba(220,39,67,0.6)); }
        .ig-icon { width: 22px; height: 22px; fill: url(#ig-grad-final); display: block; }

        /* =========================================
           ✨ 個人/賽事 詳細彈窗
        ========================================= */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 10000; opacity: 0; visibility: hidden; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: var(--bg-panel); border: 4px solid #fff; border-radius: 8px; width: 100%; max-width: 460px; position: relative; transform: scale(0.9); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 15px 15px 0px rgba(0,0,0,0.6); overflow: hidden; max-height: 90dvh; display: flex; flex-direction: column; }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-layout { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        
        .modal-photo { flex-shrink: 0; width: 100%; height: 400px; object-fit: cover; object-position: top center; border-bottom: 6px solid var(--modal-accent, #fff); }
        .modal-body { flex: 1; min-height: 0; padding: 30px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: max(40px, env(safe-area-inset-bottom)); }

        .modal-close { position: absolute; top: 15px; right: 15px; width: 40px; height: 40px; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10; cursor: pointer; transition: 0.2s; backdrop-filter: blur(4px); }

        /* =========================================

        .event-list-container { max-width: 1200px; width: 100%; margin: 30px auto 60px; padding: 0 20px; display: flex; flex-direction: column; gap: 25px; }
        .event-section-divider { font-family: var(--sport-font); display: flex; align-items: center; text-align: center; color: #fff; font-size: 20px; font-weight: 900; margin: 40px 0 10px; letter-spacing: 3px; text-transform: uppercase; }

        /* =========================================
           🛂 追星護照專屬樣式 (月曆版)
        ========================================= */
        #passport-container { max-width: 1200px; margin: 30px auto 60px; padding: 0 20px; display: none; }

        .calendar-wrapper { background: var(--bg-card); border-radius: 8px; border: 2px solid var(--border-color); padding: 20px; box-shadow: 4px 4px 0px rgba(0,0,0,0.5); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

        .calendar-nav-btn { background: #111418; border: 2px solid var(--border-color); color: #fff; border-radius: 4px; padding: 6px 15px; font-family: var(--sport-font); font-weight: 900; cursor: pointer; transition: 0.2s; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }

        ========================================= */
        #minigame-container { max-width: 1000px; margin: 30px auto 60px; padding: 0 20px; display: none; text-align: center; }
        .game-title { font-family: var(--sport-font); font-size: 32px; font-weight: 900; color: #fff; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; transform: skewX(-5deg); text-shadow: 3px 3px 0px #9c27b0; }

        function parseDateFlexible(dStr) {
            if(!dStr) return null;
            let s = String(dStr).replace(/年|月|-/g, '/').replace(/日/g, '').trim();
            let p = s.split('/').filter(x => x !== '');
            let y, m, d;
            if(p.length >= 3) { y = parseInt(p[0]); m = parseInt(p[1]); d = parseInt(p[2]); }
            else if(p.length === 2) { y = new Date().getFullYear(); m = parseInt(p[0]); d = parseInt(p[1]); }
            else return null;
            if(isNaN(m) || isNaN(d)) return null;
            let jsDate = new Date(y, m-1, d);
            const weekMap = ["Sun.", "Mon.", "Tue.", "Wed.", "Thu.", "Fri.", "Sat."];
            const monMap = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
            return { year:y, month:m, day:d, week:weekMap[jsDate.getDay()], num:parseInt(`${y}${String(m).padStart(2,'0')}${String(d).padStart(2,'0')}`), monStr: monMap[m-1] };
        }

        function parseGirlDOB(d) {
            if(!d) return { num:0, mmdd:9999 };
            let s = String(d).replace(/年|月|-/g, '/').replace(/日/g, '').trim();
            let p = s.split('/').filter(x => x !== '');
            let y=0, m=0, d_val=0;
            if(p.length >= 3) { y = parseInt(p[0]); m = parseInt(p[1]); d_val = parseInt(p[2]); } 
            else if(p.length === 2) { m = parseInt(p[0]); d_val = parseInt(p[1]); }
            return { num: parseInt(`${String(y).padStart(4,'0')}${String(m).padStart(2,'0')}${String(d_val).padStart(2,'0')}`), mmdd: parseInt(`${String(m).padStart(2,'0')}${String(d_val).padStart(2,'0')}`) };
        }

        let dbGirls = [], dbEvents = [], dbSchedules = [];
        let currentMode = "girls", currentSport = "全部", currentTeam = "全部啦啦隊";
        let currentScheduleTeam = null, currentScheduleSport = null; 

        const CACHE_KEY = "tw_cheerleader_cache_v20";
        const CACHE_TIME = 60 * 60 * 1000;

        // =========================================================================
        // 🛡️ 終極防護版：資料載入與錯誤處理

        // =========================================================================
        // 🚀 極速平行載入引擎 (解決手機轉圈卡死問題)
        // =========================================================================
        function enableEnterButton() {
            const btn = document.getElementById('enter-btn');
            const spinner = document.getElementById('loading-spinner');
            const text = document.getElementById('enter-text');
            if(btn) {
                // 強制恢復解鎖狀態與正確的點擊功能，防止被前面的錯誤機制綁架
                btn.onclick = () => {

            }
        }

        // 將 Papa.parse 包裝成 Promise，讓三個試算表可以「同時」下載
        function fetchCSV(url) {
            return new Promise((resolve, reject) => {
                Papa.parse(url, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    transformHeader: h => h.trim().toLowerCase().replace(/[\s_]/g, ""),
                    complete: res => resolve(res.data),
                    error: err => reject(err)
                });
            });
        }

        async function loadData() {
            // 1. 嘗試極速讀取手機快取
            try {
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (Date.now() - parsed.timestamp < CACHE_TIME) {
                        dbGirls = parsed.dbGirls || []; 
                        dbEvents = parsed.dbEvents || []; 
                        dbSchedules = parsed.dbSchedules || [];
                        if (dbGirls.length > 0) {
                            buildGirlMap(); init(); enableEnterButton(); return; 
                        }
                    }
                }
            } catch(e) { }

            // 2. 快取失效，開始從 Google 抓資料 (平行下載大幅提升速度)
            const t = new Date().getTime();
            const baseUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9l-hRhzMwcRdyQHsRs_97fja0Gg4RCcDDMk31u-dSbbQmk_JIUmbPTAj2gaNYmb6bYTwUvv4_1IxN/pub?output=csv";

            try {
                // 這裡會「同時」發出三個請求，載入時間直接縮短 3 倍！
                const [girlsData, eventsData, schedulesData] = await Promise.all([
                    fetchCSV(`${baseUrl}&gid=0&t=${t}`),
                    fetchCSV(`${baseUrl}&gid=925411186&t=${t}`),
                    fetchCSV(`${baseUrl}&gid=1702657458&t=${t}`)
                ]);

                // 處理女孩資料
                dbGirls = girlsData.filter(i => i.realname);

                // 處理活動資料
                dbEvents = eventsData.map(e => ({ ...e, safeDate: parseDateFlexible(e.date) })).filter(e => e.safeDate);

                // 處理班表資料
                let flat = [];
                schedulesData.forEach(row => {
                    let sport = (row.sport || "").trim();
                    let team = (row.team || "").trim();
                    let name = (row.name || row.nickname || row['綽號'] || "").trim();
                    let dStr = String(row.dates || row.date || "");
                    let dParts = dStr.split(/[,\s\n、，]+/);
                    dParts.forEach(d => {
                        const p = parseDateFlexible(d);
                        if(p && name) flat.push({ sport, team, name, safeDate: p });
                    });
                });
                dbSchedules = flat;

                // 全部資料處理完畢，順利解鎖大門！
                buildGirlMap(); 
                init(); 
                enableEnterButton();
                
                // 將最新資料存入手機快取
                try { localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), dbGirls, dbEvents, dbSchedules })); } catch(e) {}

            } catch (err) {
                // 如果真的遇到斷網或 Google 伺服器掛掉，才會顯示紅色的重試按鈕
                const btn = document.getElementById('enter-btn');
                const text = document.getElementById('enter-text');
                const spinner = document.getElementById('loading-spinner');
                if (btn && text) {
                    if (spinner) spinner.style.display = 'none';
                    btn.disabled = false;
                    btn.style.background = '#ff4757';
                    btn.style.color = '#fff';
                    btn.style.boxShadow = '6px 6px 0px #b71540';
                    text.innerHTML = '網路不穩，請點擊重試 🔄';
                    btn.onclick = () => location.reload();
                }
            }
        }

            });
        }

        // =========================================================================
        // 🎁 數據驚喜中心計算邏輯
        // =========================================================================
        function calculateHubStats() {
            const today = new Date();
            const curMonth = today.getMonth() + 1;
            const seed = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
            
            if (dbGirls.length > 0) {
                const luckyGirl = dbGirls[seed % dbGirls.length];
                document.getElementById('lucky-girl-content').innerHTML = `
                    <div class="lucky-girl-box" onclick="toggleHub(false); window.openModal('${luckyGirl.realname}')">
                        <img src="${luckyGirl.img}" class="lucky-img">
                        <div class="lucky-info">
                            <div class="lucky-name">${luckyGirl.realname}</div>
                            <div class="lucky-team">${luckyGirl.team}</div>
                        </div>
                    </div>`;
            }

            const counts = {};
            dbSchedules.filter(s => s.safeDate.month === curMonth).forEach(s => counts[s.name] = (counts[s.name] || 0) + 1);
            const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);
            
            if(sorted.length > 0) {
                let mvpName = sorted[0][0];
                let mvpCount = sorted[0][1];
                document.getElementById('mvp-content').innerHTML = `
                <div class="mvp-box" onclick="toggleHub(false); window.openModal('${mvpName}')" title="點擊查看她的專屬檔案">
                    <div class="mvp-text">本月最勤奮女孩：<span class="mvp-highlight">${mvpName}</span></div>
                    <div class="mvp-text">目前已排定 <span class="mvp-highlight">${mvpCount}</span> 場應援！🔥</div>
                    <div style="font-size:11px; color:var(--text-sub); margin-top:8px;">👉 點擊查看她的專屬檔案</div>
                </div>`;
            } else {
                document.getElementById('mvp-content').innerHTML = '<div style="color:var(--text-sub)">本月暫無應援數據</div>';
            }

            let birthdayGirlsRaw = dbGirls.filter(g => {
                let dobStr = String(g.dob || "").replace(/年|月|-/g, '/').replace(/日/g, '').trim();
                let parts = dobStr.split('/').filter(x => x !== '');
                let m = 0;
                if(parts.length >= 3) m = parseInt(parts[1]); 
                else if(parts.length === 2) m = parseInt(parts[0]); 
                return m === curMonth;
            });
            
            let uniqueBirthdays = new Map();
            birthdayGirlsRaw.forEach(g => {
                if (!uniqueBirthdays.has(g.realname)) { uniqueBirthdays.set(g.realname, g); }
            });
            let birthdayGirls = Array.from(uniqueBirthdays.values());

                    let str = String(dob || "").replace(/年|月|-/g, '/').replace(/日/g, '').trim();
                    let p = str.split('/').filter(x => x !== '');
                    if(p.length >= 3) return parseInt(p[2]);
                    if(p.length === 2) return parseInt(p[1]);
                    return 0;
                };
                return getDay(a.dob) - getDay(b.dob);
            });
            
            document.getElementById('birthday-content').innerHTML = birthdayGirls.map(g => {
                let day = 0;
                let str = String(g.dob || "").replace(/年|月|-/g, '/').replace(/日/g, '').trim();

                if(p.length >= 3) day = parseInt(p[2]);

        // =========================================================================
        // ⏳ 倒數計時器邏輯
        // =========================================================================
        function startCountdown() {
            if(countdownTimer) clearInterval(countdownTimer);
            
            const todayNum = parseInt(`${new Date().getFullYear()}${String(new Date().getMonth()+1).padStart(2,'0')}${String(new Date().getDate()).padStart(2,'0')}`);
            let upcoming = mySchedules.filter(s => s.dateNum >= todayNum).sort((a,b) => a.dateNum - b.dateNum);
            
            const titleEl = document.getElementById('countdown-title');
            const timerEl = document.getElementById('countdown-timer');

            if(!titleEl || !timerEl) return;

            if(upcoming.length === 0) {
                titleEl.innerText = "目前沒有即將到來的行程";
                timerEl.innerText = "快去加入行事曆吧！";
                timerEl.style.fontSize = "20px";
                return;
            }
            
            const nextEvent = upcoming[0];
            titleEl.innerText = `⏳ 距離 ${nextEvent.title} 還有：`;
            timerEl.style.fontSize = "32px";
            
            const y = Math.floor(nextEvent.dateNum / 10000);
            const m = Math.floor((nextEvent.dateNum % 10000) / 100) - 1;
            const d = nextEvent.dateNum % 100;
            const targetDate = new Date(y, m, d, 17, 0, 0).getTime();
            
            function update() {
                const now = new Date().getTime();
                const diff = targetDate - now;
                
                if(diff <= 0) {
                    timerEl.innerText = "🎉 就是今天！準備出發！";
                    clearInterval(countdownTimer);
                    return;
                }
                
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                
                timerEl.innerText = `${days} 天 ${hours} 小時 ${minutes} 分鐘`;
            }
            
            update();
            countdownTimer = setInterval(update, 60000); 
        }
